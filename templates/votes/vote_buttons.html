{% load meme_extras %}
{% user_vote_value meme request.user as user_vote %}

<div id="vote-container-{{ meme.id }}" class="flex items-center bg-gray-50 dark:bg-gray-900 rounded-2xl p-2 shadow-inner border border-gray-200 dark:border-gray-700 transition-colors w-full">
    <div class="px-6 border-r border-gray-200 dark:border-gray-700 shrink-0">
        <div class="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest text-center mb-1">Score</div>
        <div class="text-3xl font-black font-mono text-indigo-600 dark:text-indigo-400 text-center tracking-tighter">{{ meme.score }}</div>
    </div>
    <div class="flex px-4 gap-2 w-full justify-center">
        <button hx-post="{% url 'vote' meme.id 1 %}" 
                hx-target="#vote-container-{{ meme.id }}" 
                hx-swap="outerHTML"
                class="p-3 rounded-xl shadow-sm border transition-all flex items-center justify-center group flex-1
                       {% if user_vote == 1 %}bg-green-100 dark:bg-green-900/50 border-green-500 dark:border-green-600 text-green-700 dark:text-green-400 shadow-md transform scale-105{% else %}bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:border-green-400 dark:hover:border-green-500 hover:text-green-600 dark:hover:text-green-400 hover:bg-green-50 dark:hover:bg-green-900/20{% endif %}" 
                title="Upvote">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 {% if user_vote != 1 %}group-hover:-translate-y-1 transition-transform duration-300{% endif %}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" />
            </svg>
        </button>
        
        <button hx-post="{% url 'vote' meme.id -1 %}" 
                hx-target="#vote-container-{{ meme.id }}" 
                hx-swap="outerHTML"
                class="p-3 rounded-xl shadow-sm border transition-all flex items-center justify-center group flex-1
                       {% if user_vote == -1 %}bg-red-100 dark:bg-red-900/50 border-red-500 dark:border-red-600 text-red-700 dark:text-red-400 shadow-md transform scale-105{% else %}bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:border-red-400 dark:hover:border-red-500 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20{% endif %}" 
                title="Downvote">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 {% if user_vote != -1 %}group-hover:translate-y-1 transition-transform duration-300{% endif %}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
    </div>
</div>
