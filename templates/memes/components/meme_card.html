<div class="bg-white dark:bg-gray-800 rounded-3xl shadow-lg border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 group">
    <a href="{% url 'meme_detail' meme.slug %}" class="block relative overflow-hidden h-64 bg-gray-900 filter brightness-95 group-hover:brightness-100 transition-all">
        <img src="{{ meme.image.url }}" alt="{{ meme.title }}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-in-out mix-blend-screen opacity-90 group-hover:opacity-100">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent opacity-80"></div>
        <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
            <h2 class="text-xl font-black text-white drop-shadow-md leading-tight line-clamp-2 pr-4 group-hover:text-indigo-300 transition-colors">{{ meme.title }}</h2>
        </div>
    </a>
    
    <div class="p-5 flex-grow flex flex-col z-10 bg-white/50 dark:bg-gray-800/50 backdrop-blur-sm">
        <p class="text-sm font-semibold text-gray-400 dark:text-gray-500 mb-3 flex items-center">
            <span class="mr-2 h-6 w-6 rounded-full bg-indigo-500 text-white flex items-center justify-center text-xs border border-indigo-400">{{ meme.author.username|make_list|first|upper }}</span>
            <span class="text-gray-700 dark:text-gray-300">{{ meme.author.username }}</span> 
            <span class="mx-2 font-black text-gray-300 dark:text-gray-600">·</span> 
            {{ meme.created_at|timesince }}
        </p>
        
        <div class="flex flex-wrap gap-1.5 mb-4 mt-auto">
            {% for tag in meme.tags.all %}
            <a href="{% url 'tag_memes' tag.slug %}" class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 dark:hover:bg-indigo-800 transition-colors">
                #{{ tag.name }}
            </a>
            {% endfor %}
        </div>
        
        <div class="pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between mt-auto">
            <div class="flex items-center space-x-1.5 text-indigo-600 dark:text-indigo-400 font-bold bg-indigo-50 dark:bg-indigo-900/30 px-3 py-1.5 rounded-lg border border-indigo-100 dark:border-indigo-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd" />
                </svg>
                <span>{{ meme.score }} pts</span>
            </div>
            
            <a href="{% url 'meme_detail' meme.slug %}" class="text-gray-400 dark:text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors p-2 bg-gray-50 dark:bg-gray-700 rounded-lg shadow-sm border border-gray-100 dark:border-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </a>
        </div>
    </div>
</div>
